cubes:
  - name: fct_sales
    sql_table: public.fct_sales

    dimensions:
      - name: order_date
        sql: order_date
        type: time

      - name: quarter
        sql: quarter
        type: string

      - name: country
        sql: country
        type: string

      - name: region
        sql: region
        type: string

      - name: product_id
        sql: product_id
        type: string
        primary_key: true

      - name: product_name
        sql: product_name
        type: string

      - name: category
        sql: category
        type: string

      - name: customer_id
        sql: customer_id
        type: string

    measures:
      - name: total_orders
        sql: order_id
        type: count

      - name: total_revenue
        sql: revenue
        type: sum

      - name: total_cost
        sql: total_cost
        type: sum

      - name: total_margin
        sql: margin
        type: sum

      - name: total_quantity
        sql: quantity
        type: sum