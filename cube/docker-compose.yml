services:
  cube:
    image: cubejs/cube:v1.8.6
    container_name: metricmind-cube
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=host.docker.internal
      - CUBEJS_DB_PORT=${DB_PORT:-5432}
      - CUBEJS_DB_NAME=${DB_NAME:-metricmind}
      - CUBEJS_DB_USER=${DB_USER:-postgres}
      - CUBEJS_DB_PASS=${DB_PASSWORD}
      - CUBEJS_DEV_MODE=true
      - PORT=4000
    volumes:
      - ./model:/cube/conf/model:ro
    env_file:
      - ../backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
